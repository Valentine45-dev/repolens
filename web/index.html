<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- Theme before anything paints (no flash): a stored pick, else the system setting. Same rule
         as web/src/theme.ts (theme.dom.test.ts runs this script). -->
    <script>
      (function () {
        var stored = null;
        try { stored = window.localStorage.getItem("repolens.theme"); } catch (e) {}
        var dark = stored === "dark" || (stored !== "light" && !!window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        var root = document.documentElement;
        root.setAttribute("data-theme", dark ? "dark" : "light");
        root.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
    <!-- .ico for browsers without SVG favicons; modern browsers pick the SVG -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>RepoLens</title>
    <!-- The three font files the first screen uses, fetched alongside the stylesheet instead of
         after it: when they arrive late the text changes width and the page moves. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-400-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-500-normal.woff2" />
  </head>
  <body>
    <div id="root"></div>

    <!-- First paint, before any script has loaded. One template per kind of page, built from the
         real markup and class names (the stylesheet is in the head in the production build), so
         every placeholder sits where the element it stands for will be and nothing moves when the
         app mounts (React replaces #root's children). Real text stays real; only what the server
         will say (repo name, counts) is a grey bar. Keep in step with Home.tsx, AnalysisShell.tsx,
         Explore.tsx, Findings.tsx: web/src/firstPaint.test.ts checks the text and the classes. -->
    <template id="fp-topbar">
      <header class="topbar">
        <a class="wordmark" href="/" aria-label="RepoLens home"
          ><svg viewBox="0 0 64 64" width="20" height="20" fill="none" stroke="currentColor" class="wordmark-mark" aria-hidden="true">
            <path d="M19 33 L27 19 L35 33 Z" stroke-width="2.4" stroke-linejoin="round" />
            <circle cx="27" cy="19" r="3.6" fill="currentColor" stroke="none" />
            <circle cx="19" cy="33" r="3.6" fill="currentColor" stroke="none" />
            <circle cx="35" cy="33" r="3.6" fill="currentColor" stroke="none" />
            <circle cx="27" cy="27" r="19" stroke-width="5" />
            <path d="M41 41 L56 56" stroke-width="7" stroke-linecap="round" /></svg
          >RepoLens</a
        >
        <nav aria-label="Main"><a class="topbar-link" href="/" data-fp="home-link">New analysis</a></nav>
        <div class="topbar-end"><span class="icon-button theme-toggle" aria-hidden="true"></span></div>
      </header>
    </template>

    <template id="fp-home">
      <main>
        <div class="page">
          <h1 class="page-title">Understand a codebase before you read it.</h1>
          <p class="lede">
            RepoLens maps how the files of a public GitHub repository import and call each other. Deep
            analysis for Python and JavaScript/TypeScript.
          </p>
          <form novalidate aria-busy="false">
            <label for="repo-url" class="visually-hidden">GitHub repository URL</label>
            <div class="submit-row">
              <div class="field">
                <input
                  id="repo-url"
                  class="input"
                  type="url"
                  inputmode="url"
                  autocomplete="off"
                  spellcheck="false"
                  placeholder="https://github.com/owner/repo"
                  value=""
                />
                <span class="field-icon"
                  ><svg
                    width="16"
                    height="16"
                    viewBox="0 0 16 16"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <path d="M3.5 8.5l3 3 6-7" /></svg
                ></span>
              </div>
              <button class="button" type="submit">Analyze</button>
            </div>
            <p class="field-message">
              Public GitHub repositories only · up to 2,000 files · files over 1 MB are skipped
            </p>
          </form>
          <div class="examples">
            <span class="examples-label">Try an example</span>
            <button type="button" class="chip">pallets/itsdangerous</button>
            <button type="button" class="chip">expressjs/express</button>
            <button type="button" class="chip">sindresorhus/ky</button>
            <button type="button" class="chip">adeyosemanputra/pygoat</button>
          </div>
          <section class="section" id="fp-recent" hidden>
            <h2 class="section-title">Recent analyses <span class="caption">this browser</span></h2>
            <ul class="list"></ul>
          </section>
        </div>
      </main>
    </template>

    <template id="fp-recent-row">
      <li class="list-row">
        <a class="list-link" href="/">
          <span class="list-name mono"></span>
          <span class="list-meta">
            <span class="skeleton" style="width: 56px"></span>
            <span aria-hidden="true">·</span>
            <span class="mono num"></span>
            <span aria-hidden="true">·</span>
            <span class="skeleton" style="width: 64px"></span>
          </span>
        </a>
      </li>
    </template>

    <template id="fp-analysis-head">
      <header class="analysis-header">
        <div class="analysis-heading">
          <div class="skeleton" style="width: 240px; height: 24px" data-fp="title"></div>
        </div>
        <nav class="analysis-tabs" aria-label="Analysis">
          <a class="analysis-tab" href="#" data-fp="tab-explore">Explorer</a>
          <a class="analysis-tab" href="#" data-fp="tab-findings">Findings<span class="count mono num" style="color: transparent" aria-hidden="true">00</span></a>
        </nav>
        <button type="button" class="button button-secondary button-small analysis-ask" tabindex="-1">Ask</button>
      </header>
    </template>

    <template id="fp-explore">
      <div class="analysis-body">
        <div class="analysis-main">
          <div class="explore">
            <div class="crumb-row" data-fp="crumbs">
              <nav class="breadcrumbs" aria-label="Breadcrumb">
                <span class="icon-button breadcrumbs-up" aria-disabled="true"
                  ><svg
                    width="16"
                    height="16"
                    viewBox="0 0 16 16"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <path d="M8 13V3.5M4 7.5l4-4 4 4" /></svg
                ></span>
                <ol>
                  <li><span class="skeleton" style="width: 64px; height: 14px"></span></li>
                </ol>
              </nav>
              <p class="crumb-facts caption"><span class="skeleton toolbar-note-skeleton"></span></p>
            </div>
            <div class="toolbar" role="toolbar" aria-label="Graph options">
              <div class="segmented" role="group" aria-label="View">
                <button type="button" aria-pressed="true" data-fp="view-graph" tabindex="-1">Graph</button>
                <button type="button" aria-pressed="false" data-fp="view-list" tabindex="-1">List</button>
              </div>
              <div class="segmented" role="group" aria-label="Level of detail" data-fp="levels">
                <button type="button" aria-pressed="false" data-level="folder" tabindex="-1">Folders</button>
                <button type="button" aria-pressed="false" data-level="file" tabindex="-1">Files</button>
                <button type="button" aria-pressed="false" data-level="flat" tabindex="-1">Flat</button>
              </div>
              <button type="button" class="button button-secondary button-small" data-fp="fit" tabindex="-1">Fit</button>
              <div class="toolbar-group" role="group" aria-labelledby="explore-show-label">
                <span id="explore-show-label" class="toolbar-group-label">Show</span>
                <label class="check"><input type="checkbox" data-fp="tests" tabindex="-1" />Tests &amp; examples</label>
                <label class="check"><input type="checkbox" data-fp="guesses" tabindex="-1" />Guessed calls</label>
                <label class="check" data-disabled data-fp="alledges"><input type="checkbox" disabled tabindex="-1" />All edges</label>
              </div>
              <p class="toolbar-note caption" data-fp="listnote"><span class="skeleton toolbar-note-skeleton"></span></p>
            </div>
            <div class="legend" aria-label="Legend" data-fp="legend">
              <div class="legend-key">
                <span class="legend-row">
                  <svg width="28" height="8" aria-hidden="true"><line x1="0" y1="4" x2="28" y2="4" class="legend-line" /></svg>
                  <span data-fp="legend-solid">Import or call, arrow to the one used · number = how many · thicker = more</span>
                </span>
                <span class="legend-row" data-muted="true" data-fp="legend-guess">
                  <svg width="28" height="8" aria-hidden="true">
                    <line x1="0" y1="4" x2="28" y2="4" class="legend-line" stroke-dasharray="5 4" />
                  </svg>
                  <span data-fp="legend-dashed">Mostly guesses (hidden; turn on “Guessed calls”)</span>
                </span>
                <span class="legend-facts" data-fp="legend-facts"><span class="skeleton toolbar-note-skeleton"></span></span>
              </div>
            </div>
            <div class="explore-body">
              <div class="canvas"><div class="graph-skeleton" data-fp="canvas"><div class="graph-skeleton-grid"></div></div></div>
            </div>
          </div>
        </div>
      </div>
    </template>

    <template id="fp-card">
      <div class="graph-skeleton-card">
        <span class="skeleton" style="width: 62%"></span>
        <span class="skeleton" style="width: 40%; height: 10px"></span>
      </div>
    </template>

    <template id="fp-findings">
      <div class="analysis-body">
        <div class="analysis-main">
          <div class="findings">
            <div class="findings-main">
              <div class="findings-head">
                <h2 class="section-title">Findings</h2>
                <p class="caption">
                  These are rule-based checks. They can miss issues and can flag safe code. Review each one.
                </p>
              </div>
              <div class="toolbar findings-filters" role="toolbar" aria-label="Filter findings">
                <div class="segmented" role="group" aria-label="Category">
                  <button type="button" tabindex="-1" data-fp="cat-security">Security<span class="mono num seg-count" style="color: transparent" aria-hidden="true">00</span></button>
                  <button type="button" tabindex="-1" data-fp="cat-quality">Bug / Quality<span class="mono num seg-count" style="color: transparent" aria-hidden="true">00</span></button>
                  <button type="button" tabindex="-1" data-fp="cat-all">All<span class="mono num seg-count" style="color: transparent" aria-hidden="true">00</span></button>
                </div>
                <span class="filter"
                  ><label>Severity</label
                  ><select class="select select-severity" tabindex="-1" data-fp="severity">
                    <option value="">All</option>
                    <option value="high">High</option>
                    <option value="medium">Medium</option>
                    <option value="low">Low</option>
                  </select></span
                >
                <span class="filter"
                  ><label>Rule</label
                  ><select class="select select-rule" tabindex="-1"><option value="">All</option></select></span
                >
                <span class="filter"
                  ><label>Language</label
                  ><select class="select select-language" tabindex="-1" data-fp="language">
                    <option value="">All</option>
                    <option value="python">Python</option>
                    <option value="javascript">JavaScript</option>
                    <option value="typescript">TypeScript</option>
                  </select></span
                >
                <span class="filter"
                  ><label>Path starts with</label
                  ><input class="input input-small mono" placeholder="e.g. src/" spellcheck="false" tabindex="-1" data-fp="path"
                /></span>
                <span class="filter"
                  ><label>Order</label
                  ><select class="select select-order" tabindex="-1" data-fp="order">
                    <option value="">Default</option>
                    <option value="reachability">Reachability</option>
                  </select></span
                >
                <label class="check"><input type="checkbox" tabindex="-1" data-fp="hide-tests" />Hide test and example code</label>
                <label class="check"><input type="checkbox" tabindex="-1" data-fp="hide-placeholders" />Hide probable placeholders</label>
              </div>
              <div class="findings-table" aria-busy="true">
                <table class="table">
                  <thead><tr><th scope="col">Severity</th><th scope="col">Finding</th><th scope="col">Location</th></tr></thead>
                  <tbody>
                    <tr><td class="severity-col"><span class="skeleton" style="display: block; width: 48px"></span></td><td><span class="skeleton" style="display: block; width: 62%"></span></td><td class="location-col"><span class="skeleton" style="display: block; width: 70%"></span></td></tr>
                    <tr><td class="severity-col"><span class="skeleton" style="display: block; width: 48px"></span></td><td><span class="skeleton" style="display: block; width: 48%"></span></td><td class="location-col"><span class="skeleton" style="display: block; width: 55%"></span></td></tr>
                    <tr><td class="severity-col"><span class="skeleton" style="display: block; width: 48px"></span></td><td><span class="skeleton" style="display: block; width: 70%"></span></td><td class="location-col"><span class="skeleton" style="display: block; width: 64%"></span></td></tr>
                    <tr><td class="severity-col"><span class="skeleton" style="display: block; width: 48px"></span></td><td><span class="skeleton" style="display: block; width: 55%"></span></td><td class="location-col"><span class="skeleton" style="display: block; width: 72%"></span></td></tr>
                    <tr><td class="severity-col"><span class="skeleton" style="display: block; width: 48px"></span></td><td><span class="skeleton" style="display: block; width: 66%"></span></td><td class="location-col"><span class="skeleton" style="display: block; width: 50%"></span></td></tr>
                    <tr><td class="severity-col"><span class="skeleton" style="display: block; width: 48px"></span></td><td><span class="skeleton" style="display: block; width: 44%"></span></td><td class="location-col"><span class="skeleton" style="display: block; width: 68%"></span></td></tr>
                    <tr><td class="severity-col"><span class="skeleton" style="display: block; width: 48px"></span></td><td><span class="skeleton" style="display: block; width: 58%"></span></td><td class="location-col"><span class="skeleton" style="display: block; width: 60%"></span></td></tr>
                    <tr><td class="severity-col"><span class="skeleton" style="display: block; width: 48px"></span></td><td><span class="skeleton" style="display: block; width: 50%"></span></td><td class="location-col"><span class="skeleton" style="display: block; width: 66%"></span></td></tr>
                  </tbody>
                </table>
              </div>
            </div>
            <aside class="panel" data-fp="finding-panel">
              <header class="panel-header">
                <div class="panel-heading">
                  <span class="skeleton" style="display: block; width: 56px"></span>
                  <span class="skeleton" style="display: block; width: 80%; height: 20px; margin-top: 8px"></span>
                  <span class="skeleton" style="display: block; width: 55%; height: 12px; margin-top: 8px"></span>
                </div>
                <span class="icon-button" aria-hidden="true"></span>
              </header>
            </aside>
          </div>
        </div>
      </div>
    </template>

    <template id="fp-plain">
      <main>
        <div class="page">
          <div class="skeleton" style="width: 240px; height: 20px"></div>
          <div class="skeleton" style="width: 160px; margin-top: 16px"></div>
        </div>
      </main>
    </template>

    <script>
      (function () {
        var root = document.getElementById("root");
        var path = location.pathname;
        var q = new URLSearchParams(location.search);
        var $ = function (id) { return document.getElementById(id).content.cloneNode(true); };
        var all = function (el, sel) { return Array.prototype.slice.call(el.querySelectorAll(sel)); };
        var one = function (el, key) { return el.querySelector('[data-fp="' + key + '"]'); };
        var m = path.match(/^\/a\/(\d+)\/(explore|findings)\/?$/);
        var frag = document.createDocumentFragment();
        frag.appendChild($("fp-topbar"));

        if (path === "/") {
          one(frag, "home-link").setAttribute("aria-current", "page");
          frag.appendChild($("fp-home"));
          // Recent analyses: the names and commits are in this browser; only their status is grey.
          try {
            var recent = JSON.parse(localStorage.getItem("repolens.recent") || "[]");
            if (Array.isArray(recent) && recent.length) {
              var section = frag.querySelector("#fp-recent");
              var list = section.querySelector("ul");
              recent.forEach(function (r) {
                if (!r || typeof r.url !== "string" || typeof r.commitSha !== "string") return;
                var row = $("fp-recent-row");
                row.querySelector(".list-name").textContent = r.url.replace(/^https:\/\/github\.com\//, "").replace(/\.git$/, "").replace(/\/$/, "");
                row.querySelector(".num").textContent = r.commitSha.slice(0, 7);
                row.querySelector("a").setAttribute("href", "/a/" + r.snapshotId);
                list.appendChild(row);
              });
              if (list.children.length) section.hidden = false;
            }
          } catch (e) {}
        } else if (m) {
          var shell = document.createElement("div");
          shell.className = "analysis";
          shell.appendChild($("fp-analysis-head"));
          // An analysis started in this browser is in the recent list: its name is known now, so
          // the title is real and the tabs beside it do not move when the status arrives.
          try {
            var seen = JSON.parse(localStorage.getItem("repolens.recent") || "[]");
            var mine = Array.isArray(seen) && seen.filter(function (r) { return r && String(r.snapshotId) === m[1] && typeof r.url === "string" && typeof r.commitSha === "string"; })[0];
            if (mine) {
              var h1 = document.createElement("h1");
              h1.className = "explore-title";
              h1.innerHTML = '<a class="mono" target="_blank" rel="noreferrer"></a> <span class="repo-sha mono"></span>';
              h1.firstChild.setAttribute("href", mine.url);
              h1.firstChild.textContent = mine.url.replace(/^https:\/\/github\.com\//, "").replace(/\.git$/, "").replace(/\/$/, "");
              h1.lastChild.textContent = "@ " + mine.commitSha.slice(0, 7);
              var t = one(shell, "title");
              t.parentNode.replaceChild(h1, t);
            }
          } catch (e) {}
          var base = "/a/" + m[1];
          var keep = q.get("ask") === "1" ? "?ask=1" : "";
          var tabE = one(shell, "tab-explore"), tabF = one(shell, "tab-findings");
          tabE.setAttribute("href", base + "/explore" + keep);
          tabF.setAttribute("href", base + "/findings" + keep);
          (m[2] === "explore" ? tabE : tabF).className += " active";
          (m[2] === "explore" ? tabE : tabF).setAttribute("aria-current", "page");
          if (m[2] === "explore") {
            var body = $("fp-explore");
            var list = q.get("view") === "list";
            var level = q.get("level");
            var crumbs = one(body, "crumbs");
            if (list) {
              crumbs.remove(); one(body, "levels").remove(); one(body, "fit").remove(); one(body, "alledges").remove(); one(body, "legend").remove();
              one(body, "view-graph").setAttribute("aria-pressed", "false");
              one(body, "view-list").setAttribute("aria-pressed", "true");
              one(body, "canvas").remove();
            } else {
              all(body, "[data-level]").forEach(function (b) { if (b.getAttribute("data-level") === level) b.setAttribute("aria-pressed", "true"); });
              var root_ = (q.get("root") || "").replace(/^\/+|\/+$/g, "");
              if (root_ && level !== "flat") {
                var ol = crumbs.querySelector("ol");
                var parts = root_.split("/");
                parts.forEach(function (p, i) {
                  var li = document.createElement("li");
                  li.innerHTML = '<span class="breadcrumbs-sep" aria-hidden="true">/</span><span class="mono' + (i === parts.length - 1 ? " breadcrumbs-here" : "") + '"></span>';
                  li.lastChild.textContent = p;
                  ol.appendChild(li);
                });
              }
              one(body, "listnote").remove();
              if (level === "flat") crumbs.remove(); // the flat graph has no breadcrumb row
              if (level !== "flat") one(body, "legend-facts").remove(); // a map says its counts in the crumb row
              // Same words as web/src/legendText.ts (firstPaint.test.ts checks them).
              var flat = level === "flat";
              var guesses = q.get("guesses") === "1";
              if (flat) one(body, "legend-solid").textContent = "Import or call, arrow to the file used";
              one(body, "legend-dashed").textContent = (flat ? "Guess" : "Mostly guesses") + (guesses ? " (calls matched by name only)" : " (hidden; turn on “Guessed calls”)");
              if (guesses) one(body, "legend-guess").removeAttribute("data-muted");
              var grid = body.querySelector(".graph-skeleton-grid");
              for (var i = 0; i < 24; i++) grid.appendChild($("fp-card"));
            }
            one(body, "tests").checked = q.get("tests") === "1";
            one(body, "guesses").checked = q.get("guesses") === "1";
            shell.appendChild(body);
          } else {
            var fb = $("fp-findings");
            if (q.get("severity")) one(fb, "severity").value = q.get("severity");
            if (q.get("language")) one(fb, "language").value = q.get("language");
            if (q.get("path")) one(fb, "path").value = q.get("path");
            one(fb, "hide-tests").checked = q.get("tests") === "hide";
            one(fb, "hide-placeholders").checked = q.get("placeholders") === "hide";
            var cat = q.get("category") === "quality" || q.get("category") === "all" ? q.get("category") : "security";
            ["security", "quality", "all"].forEach(function (c) {
              one(fb, "cat-" + c).setAttribute("aria-pressed", String(cat === c));
            });
            if (!q.get("finding")) one(fb, "finding-panel").remove(); // a link to a finding opens its panel
            shell.appendChild(fb);
          }
          var main = document.createElement("main");
          main.appendChild(shell);
          frag.appendChild(main);
        } else {
          frag.appendChild($("fp-plain"));
        }
        // Not interactive: this is only the shape of the page until the app mounts.
        var holder = document.createElement("div");
        holder.setAttribute("inert", "");
        holder.style.display = "contents";
        holder.appendChild(frag);
        root.appendChild(holder);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
