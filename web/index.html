<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <!-- .ico for browsers without SVG favicons; modern browsers pick the SVG -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>RepoLens</title>
  </head>
  <body>
    <!-- Shown until the app mounts and replaces it, so a first load is never a blank page.
         Styles are inline: the stylesheet is loaded by the app itself. -->
    <div id="root">
      <p
        role="status"
        aria-busy="true"
        style="margin: 0; padding: 24px; font: 14px/1.5 system-ui, sans-serif; color: var(--text-muted, #52525b)"
      >
        Loading RepoLens…
      </p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
