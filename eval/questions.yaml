# Retrieval eval questions.
#
# Questions: written by separate AI chats given only each project's README (traps 8 and 16
# added by the project owner), trimmed for answerability before any eval run. Wording is kept
# exactly as given; the "(unanswerable)" marker is the `unanswerable` field instead of part of
# the question text, so it is never sent to the system.
#
# Labels: expected file paths and line ranges at the exact snapshot commit, found by reading the
# code (git checkout of that commit + grep). RepoLens retrieval was never used to find them.
#
# Scoring, fixed before the first run: a question is a hit at k if any of the first k retrieved
# chunks' line ranges overlaps any labelled range (same path). Unanswerable questions are not
# scored for recall; the expected behaviour is recorded for the answer-level eval.
#
# Do not edit this file after seeing results. A third repo's questions are added later as a
# separate commit.

repos:
  - name: express
    url: https://github.com/expressjs/express
    commit: 1c6f1b0fe4000977b9a7b4f34097e4d527dd9824
    questions:
      - id: 1
        question: "How does the framework decide which part of the application should handle an incoming web request?"
        expected:
          # Express 5: routing itself is in the external `router` package; this is the hand-off.
          - {path: lib/application.js, start: 152, end: 178, note: "app.handle -> this.router.handle"}
      - id: 2
        question: "How does it send a response back to someone who visits a page?"
        expected:
          - {path: lib/response.js, start: 126, end: 222, note: "res.send"}
      - id: 3
        question: "How does it handle requests that need to redirect someone to a different page?"
        expected:
          - {path: lib/response.js, start: 815, end: 867, note: "res.redirect"}
          - {path: lib/response.js, start: 797, end: 799, note: "res.location sets the Location header"}
      - id: 4
        question: "How does it help websites load faster by reusing saved responses instead of creating them again?"
        expected:
          - {path: lib/response.js, start: 161, end: 204, note: "res.send: ETag, req.fresh -> 304, body stripped"}
          - {path: lib/request.js, start: 469, end: 486, note: "req.fresh compares ETag / Last-Modified"}
          - {path: lib/utils.js, start: 249, end: 257, note: "createETagGenerator"}
      - id: 5
        question: "How does it decide which format to send back when a user’s browser can handle different types of content?"
        expected:
          - {path: lib/response.js, start: 574, end: 599, note: "res.format picks via req.accepts, else 406"}
          - {path: lib/request.js, start: 127, end: 130, note: "req.accepts"}
      - id: 6
        question: "How does it let developers use different template engines to create web pages?"
        expected:
          - {path: lib/application.js, start: 294, end: 308, note: "app.engine registers an engine per extension"}
          - {path: lib/application.js, start: 522, end: 575, note: "app.render builds a View and renders"}
          - {path: lib/view.js, start: 52, end: 95, note: "View loads the engine for the extension (require(mod).__express)"}
          - {path: lib/view.js, start: 133, end: 159, note: "View.prototype.render calls the engine"}
      - id: 7
        question: "How does the system listen on a network port for incoming connections?"
        expected:
          - {path: lib/application.js, start: 598, end: 606, note: "app.listen -> http.createServer(this).listen"}
      - id: 8
        question: "How does the tool that builds starter projects generate the folders and setup code for a new application?"
        unanswerable: true
        expected_behaviour: "could not find (the project generator is a separate package, not in this repository)"

  - name: itsdangerous
    url: https://github.com/pallets/itsdangerous
    commit: 672971d66a2ef9f85151e53283113f33d642dabd
    questions:
      - id: 9
        question: "How does the library turn user information into a token that can be safely sent between web requests?"
        expected:
          - {path: src/itsdangerous/serializer.py, start: 309, end: 320, note: "Serializer.dumps: dump_payload then sign"}
          - {path: src/itsdangerous/serializer.py, start: 271, end: 276, note: "Serializer.dump_payload"}
          - {path: src/itsdangerous/signer.py, start: 222, end: 225, note: "Signer.sign appends sep + signature"}
      - id: 10
        question: "How does it check whether someone has changed the contents of a token?"
        expected:
          - {path: src/itsdangerous/signer.py, start: 227, end: 256, note: "Signer.verify_signature and unsign"}
          - {path: src/itsdangerous/signer.py, start: 24, end: 28, note: "SigningAlgorithm.verify_signature: hmac.compare_digest"}
      - id: 11
        question: "How does it turn the token back into the original data when the application receives it?"
        expected:
          - {path: src/itsdangerous/serializer.py, start: 328, end: 343, note: "Serializer.loads: unsign then load_payload"}
          - {path: src/itsdangerous/serializer.py, start: 243, end: 269, note: "Serializer.load_payload"}
      - id: 12
        question: "How does it keep the token safe when the data needs to travel through a URL?"
        expected:
          - {path: src/itsdangerous/url_safe.py, start: 15, end: 69, note: "URLSafeSerializerMixin: base64 (+ zlib) payload"}
          - {path: src/itsdangerous/encoding.py, start: 20, end: 38, note: "URL-safe base64 encode/decode"}
      - id: 13
        question: "How does it decide when to compress the data to make the token smaller?"
        expected:
          - {path: src/itsdangerous/url_safe.py, start: 55, end: 69, note: "compress only if shorter; '.' prefix marks it"}
      - id: 14
        question: "How does it check whether a token has expired or is too old?"
        expected:
          - {path: src/itsdangerous/timed.py, start: 137, end: 153, note: "TimestampSigner.unsign: age > max_age -> SignatureExpired"}
          - {path: src/itsdangerous/timed.py, start: 185, end: 220, note: "TimedSerializer.loads passes max_age"}
      - id: 15
        question: "How does the salt value keep different uses separate even when using the same secret key?"
        expected:
          - {path: src/itsdangerous/signer.py, start: 182, end: 213, note: "Signer.derive_key mixes the salt into the key"}
          - {path: src/itsdangerous/serializer.py, start: 278, end: 285, note: "Serializer.make_signer passes the salt"}
      - id: 16
        question: "How does it encrypt the data so nobody can read what’s inside the token?"
        unanswerable: true
        expected_behaviour: "could not find, or says the data is signed but not encrypted (no encryption in this library)"
