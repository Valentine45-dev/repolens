services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: repolens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-repolens}
      POSTGRES_DB: repolens
    ports:
      # 5432 on the host is taken by the local PostgreSQL install.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db-init/02-test-db.sql:/docker-entrypoint-initdb.d/02-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repolens -d repolens"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://repolens:${POSTGRES_PASSWORD:-repolens}@db:5432/repolens
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 2g
    cpus: 2

volumes:
  pgdata:
