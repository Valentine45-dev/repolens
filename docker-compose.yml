services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: repolens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-repolens}
      POSTGRES_DB: repolens
    ports:
      # 5432 on the host is taken by the local PostgreSQL install. All ports are bound to
      # localhost only: nothing here has authentication (and the db has a default password).
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db-init/02-test-db.sql:/docker-entrypoint-initdb.d/02-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repolens -d repolens"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://repolens:${POSTGRES_PASSWORD:-repolens}@db:5432/repolens
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 2g
    cpus: 2

  web:
    build: ./web
    environment:
      API_URL: http://api:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
