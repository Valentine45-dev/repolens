name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: repolens
          POSTGRES_PASSWORD: repolens
          POSTGRES_DB: repolens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U repolens -d repolens_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://repolens:repolens@localhost:5432/repolens_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          working-directory: backend
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -q -rs
