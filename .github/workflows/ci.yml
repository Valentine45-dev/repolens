name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: repolens
          POSTGRES_PASSWORD: repolens
          POSTGRES_DB: repolens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U repolens -d repolens_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://repolens:repolens@localhost:5432/repolens_test
      # No torch or model in CI: skip the embed group (also for `uv run`) and use the stub.
      UV_NO_GROUP: embed
      EMBEDDER: stub
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          working-directory: backend
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -q -rs

  # Pure unit tests of the eval scripts (no database, no LLM, no network). Other eval/ tests
  # run real tools (Bandit) and stay local.
  eval-unit:
    runs-on: ubuntu-24.04
    env:
      UV_NO_GROUP: embed
      EMBEDDER: stub
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          working-directory: backend
          enable-cache: true
      - run: uv sync --locked
        working-directory: backend
      - run: uv run --project backend ruff check --config backend/pyproject.toml eval/locked_metrics.py eval/locked_eval.py eval/test_locked_metrics.py eval/test_locked_eval.py eval/judging_mix.py eval/test_judging_mix.py
      - run: uv run --project backend python -m pytest -q -p no:cacheprovider eval/test_locked_metrics.py eval/test_locked_eval.py eval/test_judging_mix.py
